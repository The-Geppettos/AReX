  #     - rabbitmqdata:/var/lib/rabbitmq
  #   restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.0.16.dev77
    container_name: chromadb
    ports:
      - "${CHROMA_DB_PORT}:${CHROMA_DB_PORT}"
    expose:
      - "${CHROMA_DB_PORT}"
    working_dir: /app/chromadb
    command: ["run", "--path", "./chroma_data", "--port", "${CHROMA_DB_PORT}", "--host", "chromadb"]
    volumes:
      - ./chromadb/chroma_data:/app/chromadb/chroma_data
